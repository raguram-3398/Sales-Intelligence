[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-intelligence"
version = "1.0.0"
description = "AI Sales Call Intelligence"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # FastAPI
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",

    # AI
    "anthropic>=0.40.0",
    "openai>=1.50.0",

    # Validation / Settings
    "pydantic>=2.8.0",
    "pydantic-settings>=2.5.0",

    # Dashboard
    "streamlit>=1.38.0",
    "requests>=2.32.0",

    # Config
    "python-dotenv>=1.0.1",

    # Streaming
    "partial-json-parser>=0.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",

    "ruff>=0.6.0",
    "black>=24.0.0",
    "mypy>=1.10.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP",]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
check_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true